when:
  branch: develop
  event: push

variables:
  - &deploy_host "100.109.92.68"
  - &deploy_port "22"
  - &deploy_user "deploy"
  - &app_dir "/opt/hedwig"
  - &health_url "http://localhost:8080/"
  - &health_timeout "60"

steps:
  - name: verify-release
    image: alpine:3
    commands:
      - apk add --no-cache bash git coreutils
      - bash ./scripts/verify-release-commit.sh

  - name: deploy
    image: alpine:3
    depends_on:
      - verify-release
    environment:
      SSH_KEY:
        from_secret: ssh_key
      DEPLOY_HOST: *deploy_host
      DEPLOY_PORT: *deploy_port
      DEPLOY_USER: *deploy_user
      APP_DIR: *app_dir
      HEALTH_URL: *health_url
      HEALTH_TIMEOUT: *health_timeout
    commands:
      - apk add --no-cache openssh-client coreutils bash
      - bash ./scripts/ci-deploy.sh
