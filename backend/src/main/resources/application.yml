spring:
  application:
    name: hedwig
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hedwig}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  type-enums-package: com.blueship581.hedwig.domain.enums

jwt:
  secret: ${JWT_SECRET:change-this-jwt-secret-before-production-use-please}
  expiration: ${JWT_EXPIRATION:86400000}

polling:
  # 兜底/基准轮询间隔。实际按连接生效：微泰默认 60s，欧泰/硅基默认 300s
  # （见 VendorType#getDefaultPollingIntervalSeconds，用户可在仪表盘按连接覆盖）。
  # 下面这组自适应窗口阈值以 5 分钟为基准，短周期厂商会按比例收缩并设下限。
  interval-ms: ${POLLING_INTERVAL_MS:300000}
  early-probe-start-sec: ${POLLING_EARLY_PROBE_START_SEC:25}
  core-radius-sec: ${POLLING_CORE_RADIUS_SEC:5}
  late-end-sec: ${POLLING_LATE_END_SEC:30}
  early-interval-sec: ${POLLING_EARLY_INTERVAL_SEC:8}
  core-interval-sec: ${POLLING_CORE_INTERVAL_SEC:4}
  late-interval-sec: ${POLLING_LATE_INTERVAL_SEC:6}
  max-backoff-sec: ${POLLING_MAX_BACKOFF_SEC:60}
  degraded-timeout-count: ${POLLING_DEGRADED_TIMEOUT_COUNT:2}
  disconnected-timeout-count: ${POLLING_DISCONNECTED_TIMEOUT_COUNT:5}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:3000}
